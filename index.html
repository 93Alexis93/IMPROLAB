<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171b36"><title>IMPRO LAB</title><style>body{margin:0;background:#111528;color:#f6f7ff;font:16px system-ui}header{padding:24px;background:#202745}h1{margin:0;color:#ffd16d}main{max-width:760px;margin:auto;padding:18px}button,select,input{font:inherit;border:0;border-radius:12px;padding:12px}button{background:#72d8d1;color:#10202b;font-weight:700;cursor:pointer}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}nav button{background:#303a60;color:white}.card{background:#242c4a;border-radius:18px;padding:18px;margin:12px 0}small{color:#bfc7de}h2{color:#ffd16d}label{display:block;margin:10px 0}select,input{max-width:100%;background:#f7f7fa;color:#111}section[hidden]{display:none}.pill{display:inline-block;background:#384369;padding:5px 10px;border-radius:20px;margin:3px}#timer{font-size:38px;font-weight:800}</style></head><body><header><h1>🎭 IMPRO LAB</h1><div>Le laboratoire d'impro pour le collège et la troupe</div></header><main><nav><button onclick="tab('seance')">Séance</button><button onclick="tab('jeux')">Jeux</button><button onclick="tab('mc')">Mode MC</button></nav><section id="seance"><h2>Créer une séance</h2><label>Public <select id="public"><option>Collège débutant</option><option>Troupe adulte</option></select></label><label>Durée <select id="duration"><option value="55">55 minutes</option><option value="45">45 minutes</option><option value="60">60 minutes</option><option value="90">90 minutes</option></select></label><button onclick="generate()">🎲 Générer ma séance</button><div id="plan"></div></section><section id="jeux" hidden><h2>Bibliothèque de démarrage</h2><input id="search" placeholder="Chercher un exercice" oninput="renderGames()"><div id="games"></div><small>Bibliothèque provisoire : l'import intégral de tes notes reste à effectuer.</small></section><section id="mc" hidden><h2>Mode animateur</h2><div class="card"><div id="timer">05:00</div><button onclick="start()">▶ Démarrer / pause</button> <button onclick="reset()">↺ Réinitialiser</button><label>Minutes <input id="mins" type="number" min="1" max="90" value="5" onchange="reset()"></label></div><div class="card"><h3>Tirages aléatoires</h3><button onclick="draw()">🎲 Tirer</button><p id="draw"></p></div></section></main><script>
const data=[
['Cowboy','Cohésion','En cercle, une personne nommée se baisse et ses voisins se défient en annonçant le nom de l’autre.','Collège : commencer sans élimination et ralentir le rythme.'],
['Samouraï','Énergie','Un joueur envoie SA, le receveur répond MU et ses voisins effectuent le geste RAÏ.','Collège : apprendre chaque geste séparément avant d’accélérer.'],
['Comptage collectif','Écoute','Compter ensemble sans ordre prédéfini ; si deux voix parlent en même temps, recommencer à 1.','Collège : viser 10 puis 15, sans éliminer personne.'],
['Machine humaine','Corps','Chaque joueur ajoute un mouvement répétitif et un bruit à une machine collective.','Collège : groupes de 5 puis assemblage de la machine entière.'],
['Mitraillette','Scène','Deux joueurs improvisent une scène très courte à partir d’un mot, puis laissent place aux suivants.','Collège : autoriser 15 à 20 secondes et proposer des lieux familiers.'],
['Ceci est mon nez','Lâcher-prise','Pointer une partie du corps en annonçant une autre partie ; le suivant reprend la logique.','Collège : démonstration en duo puis cercle.'],
['Fil d’Ariane','Écoute','Construire une chaîne de mots et la reproduire avec le regard ; plusieurs fils peuvent circuler.','Collège : un seul fil puis deux si le groupe est à l’aise.'],
['Histoire partagée','Narration','Construire une histoire à plusieurs, chacun apportant quelques mots.','Collège : commencer par une phrase chacun avant de passer à trois mots.'],
['Saint Graal','Émotions','Transmettre le Saint Graal en amplifiant progressivement une émotion.','Collège : choisir des émotions simples et jouer de 10 à 100 %.'],
['Doublage','Scène','Un joueur interprète un personnage muet tandis qu’un autre lui prête sa voix.','Collège : binômes et situations du quotidien.'],
['Qui-qui-où','Construction','En binôme, établir qui sont les personnages, leur relation et leur lieu.','Collège : donner un exemple et une seule information par prise de parole.'],
['Impro clap','Scène','Un joueur claque des mains, remplace un comédien et démarre une nouvelle scène en conservant sa posture.','Collège : commencer avec des postures très marquées.'],
['Patate chaude','Lâcher-prise','Répondre rapidement à une catégorie sans répétition.','Collège : pas d’élimination, seulement un défi collectif.'],
['Carré d’émotions','Émotions','Quatre zones représentent quatre émotions ; les joueurs adaptent leur jeu à la zone.','Collège : choisir joie, peur, colère et surprise.'],
['Téléphone arabe mimé','Corps','Une action mimée est transmise successivement à des joueurs qui ne l’ont pas vue.','Collège : limiter à quatre transmissions puis comparer.']
];let remaining=300,interval=null;function tab(id){document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==id);if(id==='jeux')renderGames()}function card(g){return '<div class="card"><h3>'+g[0]+'</h3><span class="pill">'+g[1]+'</span><p><b>Règle résumée :</b> '+g[2]+'</p><p><b>Variante collège proposée :</b> '+g[3]+'</p></div>'}function renderGames(){let q=document.getElementById('search').value.toLowerCase();document.getElementById('games').innerHTML=data.filter(g=>g.join(' ').toLowerCase().includes(q)).map(card).join('')||'<p>Aucun résultat.</p>'}function generate(){let d=+document.getElementById('duration').value,adult=document.getElementById('public').selectedIndex===1,parts=[['Énergie',Math.round(d*.18)],['Écoute',Math.round(d*.18)],['Corps',Math.round(d*.18)],['Construction',Math.round(d*.18)],['Scène',0]];parts[4][1]=d-parts.slice(0,4).reduce((s,p)=>s+p[1],0);let chosen=[];document.getElementById('plan').innerHTML=parts.map(p=>{let pool=data.filter(g=>g[1]===p[0]&&!chosen.includes(g[0]));if(!pool.length)pool=data.filter(g=>!chosen.includes(g[0]));let g=pool[Math.floor(Math.random()*pool.length)];chosen.push(g[0]);return '<div class="card"><small>'+p[1]+' min</small><h3>'+g[0]+'</h3><p>'+g[2]+'</p>'+(!adult?'<p><b>Adaptation collège :</b> '+g[3]+'</p>':'')+'</div>'}).join('');localStorage.setItem('impro-last-plan',document.getElementById('plan').innerHTML)}function update(){let m=Math.floor(remaining/60),s=remaining%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function start(){if(interval){clearInterval(interval);interval=null;return}interval=setInterval(()=>{if(remaining>0){remaining--;update()}else{clearInterval(interval);interval=null;alert('Temps écoulé !')}},1000)}function reset(){clearInterval(interval);interval=null;remaining=Math.max(1,+document.getElementById('mins').value||5)*60;update()}function draw(){let a=['Gare','Forêt','Restaurant','Ascenseur','Bibliothèque','Terrain de foot'],b=['Joie','Panique','Jalousie','Sérénité','Embarras'],c=['Touriste perdu','Prof enthousiaste','Pirate vegan','Magicien nul','Voisin'];let pick=x=>x[Math.floor(Math.random()*x.length)];document.getElementById('draw').textContent=pick(a)+' · '+pick(b)+' · '+pick(c)}document.getElementById('plan').innerHTML=localStorage.getItem('impro-last-plan')||'';</script></body></html>
