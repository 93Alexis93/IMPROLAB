name: Vérification IMPRO LAB
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  static:
    name: Contrôles statiques et bibliothèque
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check.cjs
  browser:
    name: Tests navigateur mobile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright
        run: npm install --no-save @playwright/test@1.56.1
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium webkit
      - name: Tests tactiles et fonctionnels
        run: npx playwright test
      - name: Conserver les preuves si échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preuves-tests-impro-lab
          path: |
            test-results/
            playwright-report/
          retention-days: 14
