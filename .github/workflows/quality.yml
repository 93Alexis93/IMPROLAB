name: IMPRO LAB quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/impro-server.log 2>&1 &
          npx playwright test tests/app.spec.cjs --reporter=list
